services:
  - type: web
    name: stepsai-backend
    runtime: python
    pythonVersion: "3.11.0"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: REQUIRE_AUTH
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: stepsai-db
          property: connectionString
      - key: LOG_LEVEL
        value: "INFO"
      - key: MAX_FILE_SIZE_MB
        value: "5"
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: stepsai-db
    databaseName: stepsai
    plan: free
